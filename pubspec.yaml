
name: peopleconnect
description: "The People Connect - Citizen Mobile App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # API Integration
  dio: ^5.11.1

  # State Management
  provider: ^6.1.5+1

  # Secure Token Storage
  flutter_secure_storage: ^11.2.0

  # Image Picker
  image_picker: ^1.2.4

  # Network Images
  cached_network_image: ^4.0.7

  # Date Formatting
  intl: ^0.20.3

  # SVG Images
  flutter_svg: ^2.4.0
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/banner/
    - assets/images/bjp/
